<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fdf6f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Always Close">
  <title>Always Close</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #fdf6f1;
      --surface:     #f0e6de;
      --surface2:    #e4d4c8;
      --accent:      #b85a42;
      --accent-soft: #e8c4b4;
      --text:        #2c1810;
      --text-muted:  #7a4a3a;
      --text-dim:    #b89080;
      --online:      #2e8f5e;
      --pulse:       rgba(184, 90, 66, 0.18);
      --divider:     rgba(184, 90, 66, 0.15);
      --ring-dur:    3s;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      transition: background 2.5s ease;
    }

    /* ── Ambient glow ── */
    #ambientGlow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 2s ease, background 2s ease;
      background: radial-gradient(ellipse 70% 55% at 50% 50%, rgba(210, 100, 70, 0.0) 0%, transparent 70%);
    }

    /* ── Heartbeat flash overlay ── */
    #hbFlash {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(210, 100, 75, 0.35) 0%, transparent 70%);
    }
    .hb-flash-anim {
      animation: hbFlashAnim 1.4s ease-out forwards !important;
    }
    @keyframes hbFlashAnim {
      0%   { opacity: 0; transform: scale(0.6); }
      20%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.3); }
    }

    /* ── App name ── */
    .app-name {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-dim);
      z-index: 10;
      white-space: nowrap;
    }

    /* ── Screens ── */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.6rem 2rem;
      z-index: 1;
      transition: opacity 0.5s ease, transform 0.5s ease;
      overflow-y: auto;
    }
    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px);
    }

    /* ── Setup ── */
    #setupScreen .heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 300;
      color: var(--text);
      text-align: center;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }
    #setupScreen .subheading {
      font-size: 0.68rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 2.8rem;
    }

    .role-buttons { display: flex; gap: 1rem; }

    .role-btn {
      background: white;
      border: 1px solid var(--accent-soft);
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      padding: 1rem 2.2rem;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 1px 8px rgba(180, 90, 66, 0.08);
      transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .role-btn:hover  { background: var(--surface); border-color: var(--accent); box-shadow: 0 2px 16px rgba(180, 90, 66, 0.14); }
    .role-btn:active { transform: scale(0.97); }

    .setup-note {
      margin-top: 2rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-align: center;
      max-width: 250px;
      line-height: 1.7;
    }

    /* ── Main ── */
    #mainScreen { gap: 0; justify-content: center; }

    /* Pulse rings */
    .pulse-wrapper {
      position: relative;
      width: 155px;
      height: 155px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.6rem;
    }
    .ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid var(--pulse);
      animation: ringPulse var(--ring-dur) ease-out infinite;
    }
    .ring:nth-child(2) { animation-delay: calc(var(--ring-dur) / 3); }
    .ring:nth-child(3) { animation-delay: calc(var(--ring-dur) / 3 * 2); }

    @keyframes ringPulse {
      0%   { transform: scale(0.35); opacity: 1; }
      100% { transform: scale(1.9);  opacity: 0; }
    }

    .distance-block { position: relative; z-index: 1; text-align: center; }

    .distance-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3.6rem, 17vw, 5.8rem);
      font-weight: 300;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.02em;
      transition: text-shadow 2s ease, color 2s ease;
    }
    .distance-unit {
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.4rem;
    }

    /* ── Partner status ── */
    .partner-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.4rem;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
      transition: background 0.4s, box-shadow 0.4s;
    }
    .status-dot.online {
      background: var(--online);
      box-shadow: 0 0 7px rgba(46, 143, 94, 0.5);
    }
    .partner-text { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 0.07em; }
    .last-updated {
      margin-top: 0.4rem;
      font-size: 0.62rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      min-height: 1em;
      text-align: center;
    }

    /* ── Divider ── */
    .divider {
      width: 36px; height: 1px;
      background: var(--divider);
      margin: 1.25rem auto;
    }

    /* ── Heartbeat button ── */
    .hb-section { text-align: center; }

    .hb-label {
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.8rem;
    }

    /* Contemporary SVG pulse button */
    .hb-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.3rem 0.6rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-appearance: none;
      transition: transform 0.12s;
      user-select: none;
    }
    .hb-btn:active { transform: scale(0.88); }

    .pulse-svg {
      width: 72px;
      height: 32px;
      overflow: visible;
    }

    /* The pulse line animates continuously */
    .pulse-path {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: pulseDraw var(--ring-dur) ease-in-out infinite;
      stroke-dasharray: 140;
      stroke-dashoffset: 0;
    }

    @keyframes pulseDraw {
      0%   { stroke-dashoffset: 140; opacity: 0.4; }
      40%  { stroke-dashoffset: 0;   opacity: 1; }
      75%  { stroke-dashoffset: 0;   opacity: 1; }
      100% { stroke-dashoffset: -140; opacity: 0.4; }
    }

    .hb-sent {
      font-size: 0.65rem;
      color: var(--accent);
      letter-spacing: 0.12em;
      margin-top: 0.4rem;
      min-height: 1em;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .hb-sent.show { opacity: 1; }

    /* ── Shared note ── */
    .note-section {
      width: 100%;
      max-width: 300px;
      text-align: center;
    }
    .note-label {
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.6rem;
    }
    .note-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--divider);
      color: var(--text-muted);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-style: italic;
      font-weight: 300;
      letter-spacing: 0.04em;
      text-align: center;
      padding: 0.3rem 0;
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.3s, color 0.3s;
    }
    .note-input::placeholder { color: var(--text-dim); }
    .note-input:focus { border-color: var(--accent-soft); color: var(--text); }

    .note-author {
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      margin-top: 0.35rem;
      min-height: 1em;
      font-style: italic;
    }

    /* ── Next meeting ── */
    .meeting-section {
      width: 100%;
      max-width: 300px;
      text-align: center;
    }
    .meeting-label {
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.8rem;
    }
    .countdown {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }
    .countdown-unit { text-align: center; }
    .countdown-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      font-weight: 300;
      color: var(--text);
      line-height: 1;
    }
    .countdown-lbl {
      font-size: 0.56rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 0.2rem;
    }
    .countdown-sep {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      color: var(--text-dim);
      padding-top: 0.25rem;
    }
    .meeting-date-display {
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.07em;
      margin-bottom: 0.9rem;
      min-height: 1.2em;
    }
    .no-meeting {
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      margin-bottom: 0.9rem;
      font-style: italic;
    }
    .set-meeting-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      justify-content: center;
    }
    .datetime-input {
      background: white;
      border: 1px solid var(--accent-soft);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 300;
      padding: 0.5rem 0.65rem;
      border-radius: 4px;
      outline: none;
      -webkit-appearance: none;
      color-scheme: light;
      flex: 1;
      min-width: 0;
    }
    .datetime-input:focus { border-color: var(--accent); }

    .set-btn {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      padding: 0.5rem 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.15s;
      -webkit-appearance: none;
      flex-shrink: 0;
    }
    .set-btn:active { transform: scale(0.97); opacity: 0.85; }

    /* ── Heart (setup screen) ── */
    .heart {
      display: inline-block;
      animation: heartbeat 2s ease-in-out infinite;
      color: var(--accent);
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%  { transform: scale(1.22); }
      28%  { transform: scale(1); }
      42%  { transform: scale(1.12); }
      56%  { transform: scale(1); }
    }
  </style>
</head>
<body>

<div id="ambientGlow"></div>
<div id="hbFlash"></div>
<div class="app-name">Always Close</div>

<!-- ── Setup ── -->
<div class="screen" id="setupScreen">
  <div class="heading">Always<br>Close</div>
  <div class="subheading">Who are you?</div>
  <div class="role-buttons">
    <button class="role-btn" onclick="init('me')">Hubby</button>
    <button class="role-btn" onclick="init('her')">Wifey <span class="heart">♡</span></button>
  </div>
  <div class="setup-note">
    Both open this link and pick your side.<br>Your location stays between you two.
  </div>
</div>

<!-- ── Main ── -->
<div class="screen hidden" id="mainScreen">

  <!-- Distance -->
  <div class="pulse-wrapper">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="distance-block">
      <div class="distance-value" id="distVal">—</div>
      <div class="distance-unit" id="distUnit">locating…</div>
    </div>
  </div>

  <div class="partner-row">
    <div class="status-dot" id="partnerDot"></div>
    <div class="partner-text" id="partnerText">Waiting for partner…</div>
  </div>
  <div class="last-updated" id="lastUpdated"></div>

  <div class="divider"></div>

  <!-- Heartbeat -->
  <div class="hb-section">
    <div class="hb-label">Send a pulse</div>
    <button class="hb-btn" onclick="sendHeartbeat()" aria-label="Send pulse">
      <!-- Contemporary EKG-style pulse line -->
      <svg class="pulse-svg" viewBox="0 0 72 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="pulse-path"
          d="M0,16 L14,16 L18,16 L22,4 L26,28 L30,10 L34,22 L38,16 L54,16 L58,16 L62,16 L72,16"
        />
      </svg>
    </button>
    <div class="hb-sent" id="hbSent">pulse sent</div>
  </div>

  <div class="divider"></div>

  <!-- Shared note -->
  <div class="note-section">
    <div class="note-label">Our note</div>
    <input class="note-input" id="noteInput" type="text" maxlength="60"
           placeholder="leave something here…"
           onblur="saveNote()" onkeydown="if(event.key==='Enter'){this.blur()}">
    <div class="note-author" id="noteAuthor"></div>
  </div>

  <div class="divider"></div>

  <!-- Next meeting -->
  <div class="meeting-section">
    <div class="meeting-label">Next Meeting</div>

    <div id="countdownDisplay" style="display:none; flex-direction:column; align-items:center;">
      <div class="countdown">
        <div class="countdown-unit">
          <div class="countdown-num" id="cdDays">0</div>
          <div class="countdown-lbl">days</div>
        </div>
        <div class="countdown-sep">·</div>
        <div class="countdown-unit">
          <div class="countdown-num" id="cdHours">00</div>
          <div class="countdown-lbl">hrs</div>
        </div>
        <div class="countdown-sep">·</div>
        <div class="countdown-unit">
          <div class="countdown-num" id="cdMins">00</div>
          <div class="countdown-lbl">min</div>
        </div>
      </div>
      <div class="meeting-date-display" id="meetingDateDisplay"></div>
    </div>

    <div class="no-meeting" id="noMeeting">No meeting set yet</div>

    <div class="set-meeting-row">
      <input type="datetime-local" class="datetime-input" id="meetingInput">
      <button class="set-btn" onclick="setMeeting()">Set ♡</button>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyAXcVB-iCQsPyy4j4G4Mawu28X03VmzM_U",
  authDomain:        "alwaysclose-305fb.firebaseapp.com",
  databaseURL:       "https://alwaysclose-305fb-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "alwaysclose-305fb",
  storageBucket:     "alwaysclose-305fb.firebasestorage.app",
  messagingSenderId: "948767326477",
  appId:             "1:948767326477:web:f5bb29959d4e486b5c7044"
};
const ROOM_ID = "alwaysclose_hubby_wifey";

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

let myRole = null, partnerRole = null;
let myPos = null, partnerPos = null, partnerTs = null;
let updatedInterval = null, countdownInterval = null;
let nextMeetingTs = null;
let lastHbTs = 0;

function init(role) {
  myRole      = role;
  partnerRole = role === 'me' ? 'her' : 'me';
  showScreen('mainScreen');
  requestNotifPermission();
  startLocation();
  listenPartner();
  listenMeeting();
  listenNote();
  listenHeartbeat();
}

// ── Notifications & Vibration ──
function requestNotifPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function vibrate(pattern) {
  if ('vibrate' in navigator) navigator.vibrate(pattern);
}

function notify(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      new Notification(title, { body, icon: '/icon.svg', badge: '/icon.svg' });
    } catch(e) { console.warn('Notification failed', e); }
  }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('hidden', s.id !== id));
}

function startLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    pos => {
      myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      db.ref(`${ROOM_ID}/${myRole}`).set({ lat: myPos.lat, lng: myPos.lng, ts: Date.now() });
      updateDistance();
    },
    err => console.warn('Geo error', err.code),
    { enableHighAccuracy: true, maximumAge: 20000, timeout: 25000 }
  );
}

function listenPartner() {
  db.ref(`${ROOM_ID}/${partnerRole}`).on('value', snap => {
    const d = snap.val();
    if (d) {
      partnerPos = { lat: d.lat, lng: d.lng };
      partnerTs  = d.ts;
      setPartnerOnline(true);
      updateDistance();
    } else {
      setPartnerOnline(false);
    }
  });
}

function updateDistance() {
  if (!myPos || !partnerPos) return;
  const km = haversine(myPos.lat, myPos.lng, partnerPos.lat, partnerPos.lng);
  const v  = document.getElementById('distVal');
  const u  = document.getElementById('distUnit');
  if (km < 0.05) {
    v.textContent = '♡'; u.textContent = "you're together";
  } else if (km < 1) {
    v.textContent = Math.round(km * 1000); u.textContent = 'metres apart';
  } else {
    v.textContent = km < 10 ? km.toFixed(1) : Math.round(km);
    u.textContent = 'km apart';
  }
  applyHeat(km);
}

// Heat: cream #fdf6f1 → warm blush #f5d0c0 as distance → 0
function applyHeat(km) {
  const maxDist = 400;
  const t = Math.max(0, Math.min(1, 1 - km / maxDist));
  const e = t * t; // ease

  // Background: cream → blush
  const bg = lerpColour([253, 246, 241], [245, 208, 192], e);
  document.body.style.background = `rgb(${bg[0]},${bg[1]},${bg[2]})`;

  // Ambient glow
  const glow = document.getElementById('ambientGlow');
  glow.style.opacity = (e * 0.7).toFixed(2);
  glow.style.background =
    `radial-gradient(ellipse 70% 55% at 50% 50%, rgba(210,100,70,${(e * 0.3).toFixed(2)}) 0%, transparent 70%)`;

  // Ring speed: 3s → 1.1s
  document.documentElement.style.setProperty('--ring-dur', (3 - e * 1.9).toFixed(2) + 's');

  // Distance number glow (subtle on light bg)
  document.getElementById('distVal').style.textShadow = e > 0.15
    ? `0 2px ${Math.round(12 + e * 20)}px rgba(184,90,66,${(0.2 + e * 0.3).toFixed(2)})`
    : 'none';
}

function lerpColour(a, b, t) {
  return a.map((v, i) => Math.round(v + (b[i] - v) * t));
}

function sendHeartbeat() {
  db.ref(`${ROOM_ID}/heartbeat`).set({ from: myRole, ts: Date.now() });
  const el = document.getElementById('hbSent');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function listenHeartbeat() {
  db.ref(`${ROOM_ID}/heartbeat`).on('value', snap => {
    const d = snap.val();
    if (!d) return;
    if (d.from === partnerRole && Date.now() - d.ts < 6000 && d.ts !== lastHbTs) {
      lastHbTs = d.ts;
      triggerHbFlash();
      vibrate([150, 80, 150]);
      if (document.hidden) notify('♡ Always Close', `${partnerRole === 'her' ? 'Wifey' : 'Hubby'} sent you a pulse`);
    }
  });
}

function triggerHbFlash() {
  const el = document.getElementById('hbFlash');
  el.classList.remove('hb-flash-anim');
  void el.offsetWidth;
  el.classList.add('hb-flash-anim');
}

function listenNote() {
  let firstLoad = true;
  db.ref(`${ROOM_ID}/note`).on('value', snap => {
    const d = snap.val();
    if (!d) return;
    const input = document.getElementById('noteInput');
    if (document.activeElement !== input) input.value = d.text || '';
    const author = document.getElementById('noteAuthor');
    author.textContent = d.text ? `— ${d.from === 'me' ? 'Hubby' : 'Wifey'}` : '';
    // Only fire on updates from partner, not on initial load or own saves
    if (!firstLoad && d.from === partnerRole && d.text) {
      vibrate([100, 60, 100]);
      if (document.hidden) notify('✍ Always Close', `${d.from === 'me' ? 'Hubby' : 'Wifey'}: "${d.text}"`);
    }
    firstLoad = false;
  });
}

function saveNote() {
  const text = document.getElementById('noteInput').value.trim();
  db.ref(`${ROOM_ID}/note`).set({ text, from: myRole, ts: Date.now() });
}

function listenMeeting() {
  let firstLoad = true;
  db.ref(`${ROOM_ID}/nextMeeting`).on('value', snap => {
    const prev = nextMeetingTs;
    nextMeetingTs = snap.val();
    renderMeeting();
    if (!firstLoad && nextMeetingTs && nextMeetingTs !== prev) {
      vibrate([100, 50, 100]);
      if (document.hidden) {
        const d = new Date(nextMeetingTs);
        const label = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })
          + ' · ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        notify('📅 Always Close', `Next meeting set — ${label}`);
      }
    }
    firstLoad = false;
  });
}

function setMeeting() {
  const val = document.getElementById('meetingInput').value;
  if (!val) return;
  const ts = new Date(val).getTime();
  if (isNaN(ts)) return;
  db.ref(`${ROOM_ID}/nextMeeting`).set(ts);
}

function renderMeeting() {
  const cd     = document.getElementById('countdownDisplay');
  const noMeet = document.getElementById('noMeeting');
  if (countdownInterval) clearInterval(countdownInterval);

  if (!nextMeetingTs || nextMeetingTs <= Date.now()) {
    cd.style.display     = 'none';
    noMeet.style.display = 'block';
    noMeet.textContent   = nextMeetingTs ? 'That meeting has passed ♡ Set the next one' : 'No meeting set yet';
    return;
  }

  cd.style.display     = 'flex';
  noMeet.style.display = 'none';

  const d = new Date(nextMeetingTs);
  document.getElementById('meetingDateDisplay').textContent =
    d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })
    + ' · ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

  function tick() {
    const diff = nextMeetingTs - Date.now();
    if (diff <= 0) { clearInterval(countdownInterval); renderMeeting(); return; }
    document.getElementById('cdDays').textContent  = Math.floor(diff / 86400000);
    document.getElementById('cdHours').textContent = String(Math.floor((diff % 86400000) / 3600000)).padStart(2,'0');
    document.getElementById('cdMins').textContent  = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
  }
  tick();
  countdownInterval = setInterval(tick, 30000);
}

function setPartnerOnline(online) {
  const dot  = document.getElementById('partnerDot');
  const text = document.getElementById('partnerText');
  const lu   = document.getElementById('lastUpdated');
  dot.classList.toggle('online', online);
  if (updatedInterval) clearInterval(updatedInterval);
  if (online) {
    text.textContent = partnerRole === 'her' ? 'Wifey is sharing location ♥' : 'Hubby is sharing location ♥';
    function age() {
      const s = Math.round((Date.now() - partnerTs) / 1000);
      lu.textContent = s < 15 ? 'Updated just now' : `Updated ${s}s ago`;
    }
    age();
    updatedInterval = setInterval(age, 10000);
  } else {
    text.textContent = 'Partner not connected yet';
    lu.textContent   = '';
  }
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*r) * Math.cos(lat2*r) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
