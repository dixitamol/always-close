<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#100609">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Always Close">
  <title>Always Close</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #100609;
      --surface:     #1e0c10;
      --surface2:    #2a1318;
      --accent:      #e8916e;
      --accent-soft: #6b3225;
      --text:        #f5ece8;
      --text-muted:  #a87868;
      --text-dim:    #7a4e44;
      --online:      #72d4a0;
      --pulse:       rgba(232, 145, 110, 0.2);
      --divider:     rgba(232, 145, 110, 0.12);
      --ring-dur:    3s;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 2s ease;
      background: var(--bg);
    }

    /* ── Ambient glow — intensity driven by JS ── */
    #ambientGlow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      transition: opacity 2s ease;
      background:
        radial-gradient(ellipse 70% 50% at 50% 50%, rgba(200, 30, 20, 0.0) 0%, transparent 70%);
    }

    /* ── Heartbeat flash overlay ── */
    #hbFlash {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(220, 60, 40, 0.55) 0%, transparent 70%);
    }

    .hb-flash-anim {
      animation: hbFlashAnim 1.4s ease-out forwards !important;
    }

    @keyframes hbFlashAnim {
      0%   { opacity: 0; transform: scale(0.6); }
      20%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.3); }
    }

    /* ── App name ── */
    .app-name {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.72rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--text-dim);
      z-index: 10;
      white-space: nowrap;
    }

    /* ── Screens ── */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.6rem 2rem;
      z-index: 1;
      transition: opacity 0.5s ease, transform 0.5s ease;
      overflow-y: auto;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px);
    }

    /* ── Setup ── */
    #setupScreen .heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 300;
      color: var(--text);
      text-align: center;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    #setupScreen .subheading {
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 2.8rem;
    }

    .role-buttons { display: flex; gap: 1rem; }

    .role-btn {
      background: var(--surface);
      border: 1px solid var(--accent-soft);
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      padding: 1rem 2.2rem;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      -webkit-appearance: none;
    }
    .role-btn:hover  { background: var(--surface2); border-color: var(--accent); }
    .role-btn:active { transform: scale(0.97); }

    .setup-note {
      margin-top: 2rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-align: center;
      max-width: 250px;
      line-height: 1.7;
    }

    /* ── Main ── */
    #mainScreen { gap: 0; justify-content: center; }

    /* Pulse rings — speed controlled by JS via --ring-dur */
    .pulse-wrapper {
      position: relative;
      width: 155px;
      height: 155px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.6rem;
    }

    .ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid var(--pulse);
      animation: ringPulse var(--ring-dur) ease-out infinite;
    }
    .ring:nth-child(2) { animation-delay: calc(var(--ring-dur) / 3); }
    .ring:nth-child(3) { animation-delay: calc(var(--ring-dur) / 3 * 2); }

    @keyframes ringPulse {
      0%   { transform: scale(0.35); opacity: 1; }
      100% { transform: scale(1.9);  opacity: 0; }
    }

    .distance-block { position: relative; z-index: 1; text-align: center; }

    .distance-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3.6rem, 17vw, 5.8rem);
      font-weight: 300;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.02em;
      transition: text-shadow 2s ease;
      text-shadow: 0 0 40px rgba(232, 145, 110, 0.3);
    }

    .distance-unit {
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.4rem;
    }

    /* ── Partner status ── */
    .partner-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.4rem;
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
      transition: background 0.4s, box-shadow 0.4s;
    }
    .status-dot.online {
      background: var(--online);
      box-shadow: 0 0 8px rgba(114, 212, 160, 0.6);
    }

    .partner-text { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 0.08em; }

    .last-updated {
      margin-top: 0.4rem;
      font-size: 0.63rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      min-height: 1em;
      text-align: center;
    }

    /* ── Divider ── */
    .divider {
      width: 36px; height: 1px;
      background: var(--divider);
      margin: 1.3rem auto;
    }

    /* ── Heartbeat button ── */
    .hb-section { text-align: center; margin-bottom: 0.2rem; }

    .hb-label {
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.7rem;
    }

    .hb-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 2.8rem;
      line-height: 1;
      display: inline-block;
      animation: heartbeat 2s ease-in-out infinite;
      transition: transform 0.1s;
      -webkit-appearance: none;
      padding: 0.2rem 0.5rem;
      user-select: none;
    }

    .hb-btn:active { transform: scale(0.85) !important; animation: none; }

    .hb-sent {
      font-size: 0.65rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-top: 0.35rem;
      min-height: 1em;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .hb-sent.show { opacity: 1; }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%  { transform: scale(1.22); }
      28%  { transform: scale(1); }
      42%  { transform: scale(1.12); }
      56%  { transform: scale(1); }
    }

    /* ── Shared note ── */
    .note-section {
      width: 100%;
      max-width: 300px;
      text-align: center;
    }

    .note-label {
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.6rem;
    }

    .note-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--divider);
      color: var(--text-muted);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-style: italic;
      font-weight: 300;
      letter-spacing: 0.04em;
      text-align: center;
      padding: 0.3rem 0;
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.3s, color 0.3s;
    }
    .note-input::placeholder { color: var(--text-dim); }
    .note-input:focus {
      border-color: var(--accent-soft);
      color: var(--text);
    }

    .note-author {
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      margin-top: 0.35rem;
      min-height: 1em;
      font-style: italic;
    }

    /* ── Next meeting ── */
    .meeting-section {
      width: 100%;
      max-width: 300px;
      text-align: center;
    }

    .meeting-label {
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.8rem;
    }

    .countdown {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .countdown-unit { text-align: center; }

    .countdown-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      font-weight: 300;
      color: var(--text);
      line-height: 1;
    }

    .countdown-lbl {
      font-size: 0.56rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 0.2rem;
    }

    .countdown-sep {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      color: var(--text-dim);
      padding-top: 0.25rem;
    }

    .meeting-date-display {
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.07em;
      margin-bottom: 0.9rem;
      min-height: 1.2em;
    }

    .no-meeting {
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      margin-bottom: 0.9rem;
      font-style: italic;
    }

    .set-meeting-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      justify-content: center;
    }

    .datetime-input {
      background: var(--surface);
      border: 1px solid var(--accent-soft);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 300;
      padding: 0.5rem 0.65rem;
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      color-scheme: dark;
      flex: 1;
      min-width: 0;
    }
    .datetime-input:focus { border-color: var(--accent); }

    .set-btn {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      padding: 0.5rem 0.9rem;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, transform 0.15s;
      -webkit-appearance: none;
      flex-shrink: 0;
    }
    .set-btn:active { transform: scale(0.97); background: var(--accent); color: #100609; }

    /* ── Heart (setup screen) ── */
    .heart {
      display: inline-block;
      animation: heartbeat 2s ease-in-out infinite;
      color: var(--accent);
    }
  </style>
</head>
<body>

<div id="ambientGlow"></div>
<div id="hbFlash"></div>
<div class="app-name">Always Close</div>

<!-- ── Setup ── -->
<div class="screen" id="setupScreen">
  <div class="heading">Always<br>Close</div>
  <div class="subheading">Who are you?</div>
  <div class="role-buttons">
    <button class="role-btn" onclick="init('me')">Hubby</button>
    <button class="role-btn" onclick="init('her')">Wifey <span class="heart">♡</span></button>
  </div>
  <div class="setup-note">
    Both open this link and pick your side.<br>Your location stays between you two.
  </div>
</div>

<!-- ── Main ── -->
<div class="screen hidden" id="mainScreen">

  <!-- Distance -->
  <div class="pulse-wrapper">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="distance-block">
      <div class="distance-value" id="distVal">—</div>
      <div class="distance-unit" id="distUnit">locating…</div>
    </div>
  </div>

  <div class="partner-row">
    <div class="status-dot" id="partnerDot"></div>
    <div class="partner-text" id="partnerText">Waiting for partner…</div>
  </div>
  <div class="last-updated" id="lastUpdated"></div>

  <div class="divider"></div>

  <!-- Heartbeat -->
  <div class="hb-section">
    <div class="hb-label">Send a heartbeat</div>
    <button class="hb-btn" onclick="sendHeartbeat()">🫀</button>
    <div class="hb-sent" id="hbSent">sent ♡</div>
  </div>

  <div class="divider"></div>

  <!-- Shared note -->
  <div class="note-section">
    <div class="note-label">Our note</div>
    <input class="note-input" id="noteInput" type="text" maxlength="60"
           placeholder="leave something here…"
           onblur="saveNote()" onkeydown="if(event.key==='Enter'){this.blur()}">
    <div class="note-author" id="noteAuthor"></div>
  </div>

  <div class="divider"></div>

  <!-- Next meeting -->
  <div class="meeting-section">
    <div class="meeting-label">Next Meeting</div>

    <div id="countdownDisplay" style="display:none; flex-direction:column; align-items:center;">
      <div class="countdown">
        <div class="countdown-unit">
          <div class="countdown-num" id="cdDays">0</div>
          <div class="countdown-lbl">days</div>
        </div>
        <div class="countdown-sep">·</div>
        <div class="countdown-unit">
          <div class="countdown-num" id="cdHours">00</div>
          <div class="countdown-lbl">hrs</div>
        </div>
        <div class="countdown-sep">·</div>
        <div class="countdown-unit">
          <div class="countdown-num" id="cdMins">00</div>
          <div class="countdown-lbl">min</div>
        </div>
      </div>
      <div class="meeting-date-display" id="meetingDateDisplay"></div>
    </div>

    <div class="no-meeting" id="noMeeting">No meeting set yet</div>

    <div class="set-meeting-row">
      <input type="datetime-local" class="datetime-input" id="meetingInput">
      <button class="set-btn" onclick="setMeeting()">Set ♡</button>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
// ── Config ──
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyAXcVB-iCQsPyy4j4G4Mawu28X03VmzM_U",
  authDomain:        "alwaysclose-305fb.firebaseapp.com",
  databaseURL:       "https://alwaysclose-305fb-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "alwaysclose-305fb",
  storageBucket:     "alwaysclose-305fb.firebasestorage.app",
  messagingSenderId: "948767326477",
  appId:             "1:948767326477:web:f5bb29959d4e486b5c7044"
};
const ROOM_ID = "alwaysclose_hubby_wifey";

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

// ── State ──
let myRole = null, partnerRole = null;
let myPos = null, partnerPos = null, partnerTs = null;
let updatedInterval = null, countdownInterval = null;
let nextMeetingTs = null;
let noteSaveTimeout = null;
let lastHbTs = 0; // to debounce heartbeat flashes

// ── Init ──
function init(role) {
  myRole      = role;
  partnerRole = role === 'me' ? 'her' : 'me';
  showScreen('mainScreen');
  startLocation();
  listenPartner();
  listenMeeting();
  listenNote();
  listenHeartbeat();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('hidden', s.id !== id));
}

// ── Geolocation ──
function startLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    pos => {
      myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      db.ref(`${ROOM_ID}/${myRole}`).set({ lat: myPos.lat, lng: myPos.lng, ts: Date.now() });
      updateDistance();
    },
    err => console.warn('Geo error', err.code),
    { enableHighAccuracy: true, maximumAge: 20000, timeout: 25000 }
  );
}

// ── Partner location ──
function listenPartner() {
  db.ref(`${ROOM_ID}/${partnerRole}`).on('value', snap => {
    const d = snap.val();
    if (d) {
      partnerPos = { lat: d.lat, lng: d.lng };
      partnerTs  = d.ts;
      setPartnerOnline(true);
      updateDistance();
    } else {
      setPartnerOnline(false);
    }
  });
}

// ── Distance + heat ──
function updateDistance() {
  if (!myPos || !partnerPos) return;
  const km = haversine(myPos.lat, myPos.lng, partnerPos.lat, partnerPos.lng);
  const v  = document.getElementById('distVal');
  const u  = document.getElementById('distUnit');

  if (km < 0.05) {
    v.textContent = '♡'; u.textContent = "you're together";
  } else if (km < 1) {
    v.textContent = Math.round(km * 1000); u.textContent = 'metres apart';
  } else {
    v.textContent = km < 10 ? km.toFixed(1) : Math.round(km);
    u.textContent = 'km apart';
  }

  applyHeat(km);
}

// ── Background heat ──
// Far (500km+) → near-black. Close (<1km) → deep crimson glow + fast pulse.
function applyHeat(km) {
  // Normalise: 0 = far, 1 = very close
  const maxDist = 400;
  const t = Math.max(0, Math.min(1, 1 - km / maxDist));
  // Ease it
  const e = t * t;

  // Background colour: interpolate #100609 → #4a0808
  const bg = lerpColour([16, 6, 9], [74, 8, 8], e);
  document.body.style.background = `rgb(${bg[0]},${bg[1]},${bg[2]})`;

  // Ambient glow opacity
  const glow = document.getElementById('ambientGlow');
  glow.style.opacity = (e * 0.85).toFixed(2);
  glow.style.background =
    `radial-gradient(ellipse 75% 60% at 50% 50%, rgba(200,25,15,${(e * 0.45).toFixed(2)}) 0%, transparent 70%)`;

  // Pulse ring speed: 3s (far) → 1.1s (close)
  const dur = (3 - e * 1.9).toFixed(2) + 's';
  document.documentElement.style.setProperty('--ring-dur', dur);

  // Distance glow
  const glowStr = e > 0.1
    ? `0 0 ${Math.round(20 + e * 60)}px rgba(232,100,80,${(0.3 + e * 0.5).toFixed(2)})`
    : '0 0 40px rgba(232,145,110,0.3)';
  document.getElementById('distVal').style.textShadow = glowStr;
}

function lerpColour(a, b, t) {
  return a.map((v, i) => Math.round(v + (b[i] - v) * t));
}

// ── Heartbeat ──
function sendHeartbeat() {
  db.ref(`${ROOM_ID}/heartbeat`).set({ from: myRole, ts: Date.now() });
  const el = document.getElementById('hbSent');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function listenHeartbeat() {
  db.ref(`${ROOM_ID}/heartbeat`).on('value', snap => {
    const d = snap.val();
    if (!d) return;
    // Only flash if it came from partner and is recent (within 6s)
    if (d.from === partnerRole && Date.now() - d.ts < 6000 && d.ts !== lastHbTs) {
      lastHbTs = d.ts;
      triggerHbFlash();
    }
  });
}

function triggerHbFlash() {
  const el = document.getElementById('hbFlash');
  el.classList.remove('hb-flash-anim');
  void el.offsetWidth; // reflow to restart animation
  el.classList.add('hb-flash-anim');
}

// ── Shared note ──
function listenNote() {
  db.ref(`${ROOM_ID}/note`).on('value', snap => {
    const d = snap.val();
    if (!d) return;
    const input = document.getElementById('noteInput');
    // Only update if not currently focused (don't disrupt typing)
    if (document.activeElement !== input) {
      input.value = d.text || '';
    }
    const author = document.getElementById('noteAuthor');
    if (d.text) {
      author.textContent = `— ${d.from === 'me' ? 'Hubby' : 'Wifey'}`;
    } else {
      author.textContent = '';
    }
  });
}

function saveNote() {
  const text = document.getElementById('noteInput').value.trim();
  db.ref(`${ROOM_ID}/note`).set({ text, from: myRole, ts: Date.now() });
}

// ── Meeting ──
function listenMeeting() {
  db.ref(`${ROOM_ID}/nextMeeting`).on('value', snap => {
    nextMeetingTs = snap.val();
    renderMeeting();
  });
}

function setMeeting() {
  const val = document.getElementById('meetingInput').value;
  if (!val) return;
  const ts = new Date(val).getTime();
  if (isNaN(ts)) return;
  db.ref(`${ROOM_ID}/nextMeeting`).set(ts);
}

function renderMeeting() {
  const cd     = document.getElementById('countdownDisplay');
  const noMeet = document.getElementById('noMeeting');
  if (countdownInterval) clearInterval(countdownInterval);

  if (!nextMeetingTs || nextMeetingTs <= Date.now()) {
    cd.style.display     = 'none';
    noMeet.style.display = 'block';
    noMeet.textContent   = nextMeetingTs
      ? 'That meeting has passed ♡ Set the next one'
      : 'No meeting set yet';
    return;
  }

  cd.style.display     = 'flex';
  noMeet.style.display = 'none';

  const d = new Date(nextMeetingTs);
  document.getElementById('meetingDateDisplay').textContent =
    d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })
    + ' · ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

  function tick() {
    const diff = nextMeetingTs - Date.now();
    if (diff <= 0) { clearInterval(countdownInterval); renderMeeting(); return; }
    document.getElementById('cdDays').textContent  = Math.floor(diff / 86400000);
    document.getElementById('cdHours').textContent = String(Math.floor((diff % 86400000) / 3600000)).padStart(2,'0');
    document.getElementById('cdMins').textContent  = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
  }
  tick();
  countdownInterval = setInterval(tick, 30000);
}

// ── Partner online status ──
function setPartnerOnline(online) {
  const dot  = document.getElementById('partnerDot');
  const text = document.getElementById('partnerText');
  const lu   = document.getElementById('lastUpdated');
  dot.classList.toggle('online', online);
  if (updatedInterval) clearInterval(updatedInterval);
  if (online) {
    text.textContent = partnerRole === 'her' ? 'Wifey is sharing location ♥' : 'Hubby is sharing location ♥';
    function age() {
      const s = Math.round((Date.now() - partnerTs) / 1000);
      lu.textContent = s < 15 ? 'Updated just now' : `Updated ${s}s ago`;
    }
    age();
    updatedInterval = setInterval(age, 10000);
  } else {
    text.textContent = 'Partner not connected yet';
    lu.textContent   = '';
  }
}

// ── Haversine ──
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*r) * Math.cos(lat2*r) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
