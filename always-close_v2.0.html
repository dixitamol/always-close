<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#100609">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Always Close">
  <title>Always Close</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #100609;
      --surface:     #1e0c10;
      --surface2:    #2a1318;
      --accent:      #e8916e;
      --accent-soft: #6b3225;
      --accent-dim:  rgba(232, 145, 110, 0.15);
      --text:        #f5ece8;
      --text-muted:  #a87868;
      --text-dim:    #7a4e44;
      --online:      #72d4a0;
      --pulse:       rgba(232, 145, 110, 0.2);
      --divider:     rgba(232, 145, 110, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 35% at 20% 15%, rgba(180, 70, 45, 0.14) 0%, transparent 70%),
        radial-gradient(ellipse 45% 45% at 80% 85%, rgba(110, 40, 28, 0.10) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app-name {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--text-dim);
      z-index: 10;
      white-space: nowrap;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      z-index: 1;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px);
    }

    /* ── Setup ── */
    #setupScreen .heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 300;
      color: var(--text);
      text-align: center;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    #setupScreen .subheading {
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 2.8rem;
    }

    .role-buttons { display: flex; gap: 1rem; }

    .role-btn {
      background: var(--surface);
      border: 1px solid var(--accent-soft);
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      padding: 1rem 2.2rem;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      -webkit-appearance: none;
    }
    .role-btn:hover  { background: var(--surface2); border-color: var(--accent); }
    .role-btn:active { transform: scale(0.97); }

    .setup-note {
      margin-top: 2rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-align: center;
      max-width: 250px;
      line-height: 1.7;
    }

    .error-msg {
      margin-top: 1.2rem;
      font-size: 0.75rem;
      color: #e07a7a;
      text-align: center;
      max-width: 260px;
      line-height: 1.5;
    }

    /* ── Main ── */
    #mainScreen { gap: 0; }

    .pulse-wrapper {
      position: relative;
      width: 165px;
      height: 165px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
    }

    .ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid var(--pulse);
      animation: ringPulse 3s ease-out infinite;
    }
    .ring:nth-child(2) { animation-delay: 1s; }
    .ring:nth-child(3) { animation-delay: 2s; }

    @keyframes ringPulse {
      0%   { transform: scale(0.35); opacity: 1; }
      100% { transform: scale(1.9);  opacity: 0; }
    }

    .distance-block { position: relative; z-index: 1; text-align: center; }

    .distance-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3.8rem, 17vw, 6rem);
      font-weight: 300;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.02em;
      text-shadow: 0 0 40px rgba(232, 145, 110, 0.3);
    }

    .distance-unit {
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.4rem;
    }

    .partner-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.8rem;
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
      transition: background 0.4s, box-shadow 0.4s;
    }
    .status-dot.online {
      background: var(--online);
      box-shadow: 0 0 8px rgba(114, 212, 160, 0.6);
    }

    .partner-text { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 0.08em; }

    .last-updated {
      margin-top: 0.45rem;
      font-size: 0.63rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      min-height: 1em;
      text-align: center;
    }

    /* ── Divider ── */
    .divider {
      width: 36px; height: 1px;
      background: var(--divider);
      margin: 1.6rem auto;
    }

    /* ── Next Meeting ── */
    .meeting-section {
      width: 100%;
      max-width: 300px;
      text-align: center;
    }

    .meeting-label {
      font-size: 0.63rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.9rem;
    }

    .countdown {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.6rem;
    }

    .countdown-unit { text-align: center; }

    .countdown-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.6rem;
      font-weight: 300;
      color: var(--text);
      line-height: 1;
    }

    .countdown-lbl {
      font-size: 0.57rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 0.2rem;
    }

    .countdown-sep {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      color: var(--text-dim);
      padding-top: 0.2rem;
    }

    .meeting-date-display {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.07em;
      margin-bottom: 1rem;
      min-height: 1.2em;
    }

    .no-meeting {
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      margin-bottom: 1rem;
      font-style: italic;
    }

    .set-meeting-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      justify-content: center;
    }

    .datetime-input {
      background: var(--surface);
      border: 1px solid var(--accent-soft);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 300;
      padding: 0.55rem 0.7rem;
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      color-scheme: dark;
      flex: 1;
      min-width: 0;
    }
    .datetime-input:focus { border-color: var(--accent); }

    .set-btn {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      padding: 0.55rem 1rem;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, transform 0.15s;
      -webkit-appearance: none;
      flex-shrink: 0;
    }
    .set-btn:active { transform: scale(0.97); background: var(--accent); color: #100609; }

    /* Heart */
    .heart {
      display: inline-block;
      animation: heartbeat 2s ease-in-out infinite;
      color: var(--accent);
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%  { transform: scale(1.28); }
      28%  { transform: scale(1); }
      42%  { transform: scale(1.15); }
      56%  { transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="app-name">Always Close</div>

<!-- ── Setup ── -->
<div class="screen" id="setupScreen">
  <div class="heading">Always<br>Close</div>
  <div class="subheading">Who are you?</div>
  <div class="role-buttons">
    <button class="role-btn" onclick="init('me')">Hubby</button>
    <button class="role-btn" onclick="init('her')">Wifey <span class="heart">♡</span></button>
  </div>
  <div class="setup-note">
    Both open this link and pick your side.<br>Your location stays between you two.
  </div>
  <div class="error-msg" id="setupError"></div>
</div>

<!-- ── Main ── -->
<div class="screen hidden" id="mainScreen">

  <div class="pulse-wrapper">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="distance-block">
      <div class="distance-value" id="distVal">—</div>
      <div class="distance-unit" id="distUnit">locating…</div>
    </div>
  </div>

  <div class="partner-row">
    <div class="status-dot" id="partnerDot"></div>
    <div class="partner-text" id="partnerText">Waiting for partner…</div>
  </div>
  <div class="last-updated" id="lastUpdated"></div>

  <div class="divider"></div>

  <div class="meeting-section">
    <div class="meeting-label">Next Meeting</div>

    <div id="countdownDisplay" style="display:none; flex-direction:column; align-items:center;">
      <div class="countdown">
        <div class="countdown-unit">
          <div class="countdown-num" id="cdDays">0</div>
          <div class="countdown-lbl">days</div>
        </div>
        <div class="countdown-sep">·</div>
        <div class="countdown-unit">
          <div class="countdown-num" id="cdHours">00</div>
          <div class="countdown-lbl">hrs</div>
        </div>
        <div class="countdown-sep">·</div>
        <div class="countdown-unit">
          <div class="countdown-num" id="cdMins">00</div>
          <div class="countdown-lbl">min</div>
        </div>
      </div>
      <div class="meeting-date-display" id="meetingDateDisplay"></div>
    </div>

    <div class="no-meeting" id="noMeeting">No meeting set yet</div>

    <div class="set-meeting-row">
      <input type="datetime-local" class="datetime-input" id="meetingInput">
      <button class="set-btn" onclick="setMeeting()">Set ♡</button>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyAXcVB-iCQsPyy4j4G4Mawu28X03VmzM_U",
  authDomain:        "alwaysclose-305fb.firebaseapp.com",
  databaseURL:       "https://alwaysclose-305fb-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "alwaysclose-305fb",
  storageBucket:     "alwaysclose-305fb.firebasestorage.app",
  messagingSenderId: "948767326477",
  appId:             "1:948767326477:web:f5bb29959d4e486b5c7044"
};

const ROOM_ID = "alwaysclose_hubby_wifey";

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

let myRole = null, partnerRole = null;
let myPos = null, partnerPos = null, partnerTs = null;
let updatedInterval = null, countdownInterval = null;
let nextMeetingTs = null;

function init(role) {
  myRole      = role;
  partnerRole = role === 'me' ? 'her' : 'me';
  showScreen('mainScreen');
  startLocation();
  listenPartner();
  listenMeeting();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.toggle('hidden', s.id !== id);
  });
}

function startLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    pos => {
      myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      db.ref(`${ROOM_ID}/${myRole}`).set({ lat: myPos.lat, lng: myPos.lng, ts: Date.now() });
      updateDistance();
    },
    err => console.warn('Geo error', err.code),
    { enableHighAccuracy: true, maximumAge: 20000, timeout: 25000 }
  );
}

function listenPartner() {
  db.ref(`${ROOM_ID}/${partnerRole}`).on('value', snap => {
    const data = snap.val();
    if (data) {
      partnerPos = { lat: data.lat, lng: data.lng };
      partnerTs  = data.ts;
      setPartnerOnline(true);
      updateDistance();
    } else {
      setPartnerOnline(false);
    }
  });
}

function listenMeeting() {
  db.ref(`${ROOM_ID}/nextMeeting`).on('value', snap => {
    nextMeetingTs = snap.val();
    renderMeeting();
  });
}

function setMeeting() {
  const val = document.getElementById('meetingInput').value;
  if (!val) return;
  const ts = new Date(val).getTime();
  if (isNaN(ts)) return;
  db.ref(`${ROOM_ID}/nextMeeting`).set(ts);
}

function renderMeeting() {
  const cd     = document.getElementById('countdownDisplay');
  const noMeet = document.getElementById('noMeeting');
  if (countdownInterval) clearInterval(countdownInterval);

  if (!nextMeetingTs || nextMeetingTs <= Date.now()) {
    cd.style.display     = 'none';
    noMeet.style.display = 'block';
    noMeet.textContent   = nextMeetingTs ? 'That meeting has passed ♡ Set the next one' : 'No meeting set yet';
    return;
  }

  cd.style.display     = 'flex';
  noMeet.style.display = 'none';

  const d = new Date(nextMeetingTs);
  document.getElementById('meetingDateDisplay').textContent =
    d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })
    + ' · ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

  function tick() {
    const diff = nextMeetingTs - Date.now();
    if (diff <= 0) { clearInterval(countdownInterval); renderMeeting(); return; }
    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000)  / 60000);
    document.getElementById('cdDays').textContent  = days;
    document.getElementById('cdHours').textContent = String(hours).padStart(2, '0');
    document.getElementById('cdMins').textContent  = String(mins).padStart(2, '0');
  }
  tick();
  countdownInterval = setInterval(tick, 30000);
}

function updateDistance() {
  if (!myPos || !partnerPos) return;
  const km = haversine(myPos.lat, myPos.lng, partnerPos.lat, partnerPos.lng);
  const v  = document.getElementById('distVal');
  const u  = document.getElementById('distUnit');
  if (km < 0.05) {
    v.textContent = '♡'; u.textContent = "you're together";
  } else if (km < 1) {
    v.textContent = Math.round(km * 1000); u.textContent = 'metres apart';
  } else {
    v.textContent = km < 10 ? km.toFixed(1) : Math.round(km); u.textContent = 'km apart';
  }
}

function setPartnerOnline(online) {
  const dot  = document.getElementById('partnerDot');
  const text = document.getElementById('partnerText');
  const lu   = document.getElementById('lastUpdated');
  dot.classList.toggle('online', online);
  if (online) {
    text.textContent = partnerRole === 'her' ? 'Wifey is sharing location ♥' : 'Hubby is sharing location ♥';
    if (updatedInterval) clearInterval(updatedInterval);
    function age() {
      const s = Math.round((Date.now() - partnerTs) / 1000);
      lu.textContent = s < 15 ? 'Updated just now' : `Updated ${s}s ago`;
    }
    age();
    updatedInterval = setInterval(age, 10000);
  } else {
    text.textContent = 'Partner not connected yet';
    lu.textContent   = '';
    if (updatedInterval) clearInterval(updatedInterval);
  }
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*r) * Math.cos(lat2*r) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
</script>
</body>
</html>
